<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0b1120; font-family:'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title Block Header -->
  <rect x="40" y="30" width="1120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="65" fill="#f8fafc" font-size="20" font-weight="bold">DATA FLOW DIAGRAMS: LEVEL-0 (CONTEXT) &amp; LEVEL-1 (PROCESS FLOW)</text>
  <text x="60" y="82" fill="#94a3b8" font-size="12">Cyber-Physical Data Pathways · Space Reclamation &amp; Microgrid Load Optimization</text>
  <text x="1000" y="65" fill="#38bdf8" font-size="14" font-weight="bold">ALLIANCE UNIVERSITY</text>
  <text x="1000" y="82" fill="#64748b" font-size="11">ASAC CSE · SEMESTER V</text>

  <!-- LEFT: DFD LEVEL 0 CONTEXT DIAGRAM -->
  <g transform="translate(60, 110)">
    <rect width="480" height="610" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="240" y="35" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">DFD LEVEL-0: SYSTEM CONTEXT DIAGRAM</text>
    
    <!-- Central Process Bubble -->
    <circle cx="240" cy="310" r="85" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow2)"/>
    <text x="240" y="295" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">0.0</text>
    <text x="240" y="312" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Smart Campus</text>
    <text x="240" y="328" fill="#f8fafc" font-size="11" text-anchor="middle">Digital Twin</text>
    <text x="240" y="342" fill="#94a3b8" font-size="9" text-anchor="middle">Platform</text>

    <!-- External Entity: ERP Portal -->
    <rect x="150" y="60" width="180" height="45" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="240" y="87" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">Alliance ERP &amp; Timetables</text>
    <line x1="240" y1="105" x2="240" y2="225" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="250" y="160" fill="#94a3b8" font-size="9">Classroom Schedules</text>

    <!-- External Entity: BESCOM Grid -->
    <rect x="20" y="285" width="120" height="50" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="80" y="308" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">BESCOM Grid</text>
    <text x="80" y="323" fill="#94a3b8" font-size="9" text-anchor="middle">&amp; Solar Meters</text>
    <line x1="140" y1="310" x2="155" y2="310" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- External Entity: Campus Facilities -->
    <rect x="340" y="285" width="120" height="50" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="400" y="308" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">Estate Facilities</text>
    <text x="400" y="323" fill="#94a3b8" font-size="9" text-anchor="middle">Manager</text>
    <line x1="325" y1="310" x2="340" y2="310" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="330" y="280" fill="#fde68a" font-size="8">Chiller Setbacks</text>

    <!-- External Entity: IoT Sensors -->
    <rect x="150" y="520" width="180" height="45" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="240" y="547" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">1,000+ Spatial IoT Sensors</text>
    <line x1="240" y1="520" x2="240" y2="395" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="250" y="460" fill="#94a3b8" font-size="9">Occupancy &amp; Lux</text>
  </g>

  <!-- RIGHT: DFD LEVEL 1 DETAILED PROCESS FLOW -->
  <g transform="translate(560, 110)">
    <rect width="580" height="610" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="290" y="35" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">DFD LEVEL-1: SUB-PROCESS PIPELINE</text>

    <!-- Process 1.0 -->
    <circle cx="120" cy="110" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="120" y="105" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">1.0</text>
    <text x="120" y="118" fill="#a7f3d0" font-size="9" text-anchor="middle">Ingest Feeds</text>

    <!-- Process 2.0 -->
    <circle cx="420" cy="110" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="420" y="105" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">2.0</text>
    <text x="420" y="118" fill="#a7f3d0" font-size="9" text-anchor="middle">Ghost Detect</text>
    <text x="420" y="130" fill="#94a3b8" font-size="8" text-anchor="middle">(15-min Hys)</text>

    <!-- Process 3.0 -->
    <circle cx="270" cy="270" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="270" y="265" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">3.0</text>
    <text x="270" y="278" fill="#a7f3d0" font-size="9" text-anchor="middle">Microgrid Bal</text>
    <text x="270" y="290" fill="#94a3b8" font-size="8" text-anchor="middle">&amp; PV Curve</text>

    <!-- Process 4.0 -->
    <circle cx="120" cy="440" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="120" y="435" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">4.0</text>
    <text x="120" y="448" fill="#a7f3d0" font-size="9" text-anchor="middle">BESS Peak</text>
    <text x="120" y="460" fill="#94a3b8" font-size="8" text-anchor="middle">Dispatch</text>

    <!-- Process 5.0 -->
    <circle cx="420" cy="440" r="38" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="420" y="435" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">5.0</text>
    <text x="420" y="448" fill="#a7f3d0" font-size="9" text-anchor="middle">Chiller</text>
    <text x="420" y="460" fill="#94a3b8" font-size="8" text-anchor="middle">Setbacks</text>

    <!-- Data Stores -->
    <rect x="200" y="165" width="140" height="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="200" y1="165" x2="200" y2="195" stroke="#f59e0b" stroke-width="3"/>
    <text x="270" y="184" fill="#fde68a" font-size="9" font-weight="bold" text-anchor="middle">D1: Timetables</text>

    <rect x="200" y="355" width="140" height="30" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="200" y1="355" x2="200" y2="385" stroke="#f59e0b" stroke-width="3"/>
    <text x="270" y="374" fill="#fde68a" font-size="9" font-weight="bold" text-anchor="middle">D2: Microgrid Logs</text>

    <!-- Connecting lines -->
    <line x1="158" y1="110" x2="382" y2="110" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="120" y1="148" x2="240" y2="245" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="270" y1="308" x2="148" y2="415" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="420" y1="148" x2="420" y2="402" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="430" y="270" fill="#fde68a" font-size="8">Ghost Alert</text>

    <rect x="180" y="525" width="220" height="40" rx="4" fill="#1e293b" stroke="#64748b"/>
    <text x="290" y="545" fill="#f1f5f9" font-size="10" font-weight="bold" text-anchor="middle">Estate Facilities Actuation</text>
    <text x="290" y="558" fill="#94a3b8" font-size="8" text-anchor="middle">Sub-second Chiller &amp; Pump Commands</text>
    <line x1="420" y1="478" x2="350" y2="525" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="120" y1="478" x2="230" y2="525" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- Engineering Footer Strip -->
  <rect x="40" y="740" width="1120" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="765" fill="#64748b" font-size="10">DRAWING NO: AU-DP1-DWG-002 | SHEET 2 OF 5 | SCALE: N.T.S. | PROJECTION: THIRD ANGLE</text>
  <text x="800" y="765" fill="#94a3b8" font-size="10">DESIGNED BY: LIKITH S (LEAD) | MENTOR: DR. RASHMI MOTHKUR</text>
</svg>
