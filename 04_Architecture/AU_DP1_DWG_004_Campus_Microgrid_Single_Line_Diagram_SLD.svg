<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#0b1120; font-family:'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="busArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title Block Header -->
  <rect x="40" y="30" width="1120" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="65" fill="#f8fafc" font-size="20" font-weight="bold">CAMPUS MICROGRID SINGLE-LINE DIAGRAM (SLD) &amp; POWER FLOW</text>
  <text x="60" y="82" fill="#94a3b8" font-size="12">11 kV BESCOM Grid Incomer · 480 kWp Solar PV · 1.2 MWh BESS Storage · 415 V LT Distribution</text>
  <text x="1000" y="65" fill="#38bdf8" font-size="14" font-weight="bold">ALLIANCE UNIVERSITY</text>
  <text x="1000" y="82" fill="#64748b" font-size="11">ASAC CSE · SEMESTER V</text>

  <!-- Main Canvas Frame -->
  <rect x="40" y="105" width="1120" height="620" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- POWER SOURCE 1: BESCOM 11 kV Grid Incomer -->
  <g transform="translate(100, 140)">
    <circle cx="60" cy="40" r="30" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="60" y="36" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle">BESCOM</text>
    <text x="60" y="49" fill="#fca5a5" font-size="9" text-anchor="middle">11 kV Grid</text>

    <!-- Circuit Breaker -->
    <line x1="60" y1="70" x2="60" y2="100" stroke="#f8fafc" stroke-width="2"/>
    <rect x="52" y="100" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="75" y="112" fill="#94a3b8" font-size="8">VCB-01</text>
    
    <!-- Transformer Symbol -->
    <line x1="60" y1="116" x2="60" y2="140" stroke="#f8fafc" stroke-width="2"/>
    <circle cx="60" cy="155" r="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="175" r="18" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="168" fill="#38bdf8" font-size="9" font-weight="bold">1000 kVA</text>
    <text x="95" y="180" fill="#94a3b8" font-size="8">11 kV / 415 V</text>

    <!-- Feed to Bus -->
    <line x1="60" y1="193" x2="60" y2="240" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- POWER SOURCE 2: 480 kWp Rooftop Solar PV -->
  <g transform="translate(480, 140)">
    <rect x="20" y="15" width="120" height="50" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="36" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">Solar PV Array</text>
    <text x="80" y="52" fill="#94a3b8" font-size="9" text-anchor="middle">480 kWp (DC)</text>

    <!-- Inverter Symbol -->
    <line x1="80" y1="65" x2="80" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="60" y="110" width="40" height="40" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="60" y1="150" x2="100" y2="110" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="128" fill="#f8fafc" font-size="8">=</text>
    <text x="85" y="142" fill="#f8fafc" font-size="8">~</text>
    <text x="110" y="132" fill="#fde68a" font-size="9">MPPT Inv</text>

    <!-- Feed to Bus -->
    <line x1="80" y1="150" x2="80" y2="240" stroke="#f59e0b" stroke-width="2.5"/>
  </g>

  <!-- POWER SOURCE 3: 1.2 MWh LiFePO4 BESS Storage -->
  <g transform="translate(860, 140)">
    <rect x="20" y="15" width="120" height="50" rx="4" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="36" fill="#a7f3d0" font-size="10" font-weight="bold" text-anchor="middle">1.2 MWh BESS</text>
    <text x="80" y="52" fill="#94a3b8" font-size="9" text-anchor="middle">LiFePO4 Storage</text>

    <!-- Bidirectional Converter Symbol -->
    <line x1="80" y1="65" x2="80" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="60" y="110" width="40" height="40" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <line x1="60" y1="150" x2="100" y2="110" stroke="#34d399" stroke-width="1.5"/>
    <text x="68" y="128" fill="#f8fafc" font-size="8">~</text>
    <text x="85" y="142" fill="#f8fafc" font-size="8">=</text>
    <text x="110" y="132" fill="#a7f3d0" font-size="9">Bi-Dir PCS</text>

    <!-- Feed to Bus -->
    <line x1="80" y1="150" x2="80" y2="240" stroke="#34d399" stroke-width="2.5"/>
  </g>

  <!-- MAIN 415 V 3-PHASE LT COPPER BUSBAR -->
  <g transform="translate(80, 380)">
    <rect x="0" y="0" width="1040" height="14" fill="#38bdf8" rx="3" filter="url(#shadow4)"/>
    <text x="520" y="28" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">MAIN 415 V, 3-PHASE, 50 Hz LOW TENSION (LT) SYNCHRONIZATION BUSBAR</text>
  </g>

  <!-- Feeder Connections Going Down to Campus Loads -->
  <g transform="translate(80, 420)">
    <!-- Feeder 1: ACED Labs -->
    <line x1="120" y1="-26" x2="120" y2="40" stroke="#f8fafc" stroke-width="2"/>
    <rect x="112" y="40" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="120" y1="56" x2="120" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="40" y="110" width="160" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="120" y="132" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">ACED Engineering</text>
    <text x="120" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Chillers &amp; Computing Labs</text>
    <text x="120" y="165" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Demand: 280 kW</text>

    <!-- Feeder 2: Central Library -->
    <line x1="320" y1="-26" x2="320" y2="40" stroke="#f8fafc" stroke-width="2"/>
    <rect x="312" y="40" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="320" y1="56" x2="320" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="240" y="110" width="160" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="320" y="132" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Central Library</text>
    <text x="320" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">HVAC &amp; Reading Halls</text>
    <text x="320" y="165" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Demand: 120 kW</text>

    <!-- Feeder 3: Admin Block -->
    <line x1="520" y1="-26" x2="520" y2="40" stroke="#f8fafc" stroke-width="2"/>
    <rect x="512" y="40" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="520" y1="56" x2="520" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="440" y="110" width="160" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="520" y="132" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Administrative Block</text>
    <text x="520" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Chancellery &amp; Offices</text>
    <text x="520" y="165" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Demand: 85 kW</text>

    <!-- Feeder 4: Student Hostels -->
    <line x1="720" y1="-26" x2="720" y2="40" stroke="#f8fafc" stroke-width="2"/>
    <rect x="712" y="40" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="720" y1="56" x2="720" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="640" y="110" width="160" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="720" y="132" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">Student Hostels</text>
    <text x="720" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Water Heaters &amp; Dining</text>
    <text x="720" y="165" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Demand: 160 kW</text>

    <!-- Feeder 5: STP & Utilities -->
    <line x1="920" y1="-26" x2="920" y2="40" stroke="#f8fafc" stroke-width="2"/>
    <rect x="912" y="40" width="16" height="16" fill="#1e293b" stroke="#f8fafc" stroke-width="1.5"/>
    <line x1="920" y1="56" x2="920" y2="110" stroke="#f8fafc" stroke-width="2"/>
    <rect x="840" y="110" width="160" height="70" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="920" y="132" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">STP &amp; Water Pumps</text>
    <text x="920" y="148" fill="#94a3b8" font-size="9" text-anchor="middle">Automated Actuator Loads</text>
    <text x="920" y="165" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">Demand: 45 kW</text>
  </g>

  <!-- Engineering Footer Strip -->
  <rect x="40" y="740" width="1120" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="60" y="765" fill="#64748b" font-size="10">DRAWING NO: AU-DP1-DWG-004 | SHEET 4 OF 5 | SCALE: N.T.S. | PROJECTION: THIRD ANGLE</text>
  <text x="800" y="765" fill="#94a3b8" font-size="10">DESIGNED BY: LIKITH S (LEAD) | MENTOR: DR. RASHMI MOTHKUR</text>
</svg>
